<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | {{ site.Title }}</title>
</head>
<body>
  <main>
    {{ .Content }}
    {{ range .Pages }}
      <p><a href="{{ .RelPermalink }}">{{ .Title }}</a></p>
    {{ end }}
  </main>
</body>
</html>
